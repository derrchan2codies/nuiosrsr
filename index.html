<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text boxes</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: white; color: black; font: 16px/1.5 Arial, sans-serif; }
    main { max-width: 920px; margin: 0 auto; border: 2px solid black; padding: 32px; }
    section + section { margin-top: 24px; }
    h2 { margin: 0 0 8px; font-size: 16px; font-weight: normal; }
    .box { border: 1px solid black; padding: 16px; min-height: 112px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow-y: auto; }
    #box1 { min-height: 180px; }
    #box3 { min-height: 80px; }
    .actions { margin-top: 8px; display: flex; justify-content: flex-end; }
    button { min-height: 44px; border: 1px solid black; border-radius: 0; padding: 8px 16px; background: white; color: black; font: inherit; cursor: pointer; }
    button:hover:not(:disabled) { background: black; color: white; }
    button:focus-visible { outline: 2px solid black; outline-offset: 4px; }
    button:disabled { cursor: not-allowed; border-style: dashed; }
    .note { margin: 16px 0 0; font-size: 14px; }
    #status { margin: 8px 0 0; font-size: 14px; min-height: 21px; }
    @media (max-width: 540px) {
      body { padding: 16px; }
      main { padding: 16px; }
    }
  </style>
</head>
<body>
  <main aria-label="Text presentation prototype">
    <section aria-labelledby="label1">
      <h2 id="label1">box 1</h2>
      <div id="box1" class="box" role="region" aria-labelledby="label1" aria-live="polite"></div>
      <div class="actions"><button id="retrieve" type="button">retrieve from database</button></div>
    </section>
    <section aria-labelledby="label2">
      <h2 id="label2">box 2</h2>
      <div id="box2" class="box" role="region" aria-labelledby="label2" aria-live="polite"></div>
      <div class="actions"><button id="analyse" type="button">LLM analysis</button></div>
    </section>
    <section aria-labelledby="label3">
      <h2 id="label3">box 3</h2>
      <div id="box3" class="box" role="region" aria-labelledby="label3" aria-live="polite"></div>
      <div class="actions"><button id="copy-box2" type="button">retrieve box 2 answer</button></div>
      <div class="actions"><button id="prescription" type="button">retrieve prescription</button></div>
    </section>
    <p class="note">Box 1 always shows row 1, column stuff. LLM analysis and retrieve prescription each use their own prompt and replace that box with only the answer.</p>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const box1 = document.getElementById('box1');
    const box2 = document.getElementById('box2');
    const box3 = document.getElementById('box3');
    const status = document.getElementById('status');
    const retrieveButton = document.getElementById('retrieve');
    const analyseButton = document.getElementById('analyse');
    const prescriptionButton = document.getElementById('prescription');

    function errorText(data, fallback) {
      return data && typeof data.error === 'string' && data.error.trim()
        ? data.error
        : fallback;
    }

    async function retrieveConsultation() {
      retrieveButton.disabled = true;
      box1.setAttribute('aria-busy', 'true');
      status.textContent = 'Retrieving the consultation.';

      try {
        const response = await fetch('/api/retrieve-consultation', {
          cache: 'no-store'
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          status.textContent = errorText(data, 'Could not retrieve the consultation. Please try again.');
          return;
        }

        const text = typeof data.text === 'string' ? data.text : '';
        box1.textContent = text;
        status.textContent = text.trim()
          ? 'Consultation loaded into box 1.'
          : 'Row 1 has no text in the stuff column.';
      } catch {
        status.textContent = 'Could not retrieve the consultation. Please try again.';
      } finally {
        retrieveButton.disabled = false;
        box1.removeAttribute('aria-busy');
      }
    }

    // Sends text to one Venice route and replaces the target box with only the reply.
    async function askVenice(url, text, box, button, pendingStatus, doneStatus) {
      button.disabled = true;
      box.setAttribute('aria-busy', 'true');
      status.textContent = pendingStatus;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          status.textContent = errorText(data, 'The request failed. Please try again.');
          return;
        }

        if (typeof data.reply !== 'string') {
          status.textContent = 'The response did not include an answer.';
          return;
        }

        box.textContent = data.reply;
        status.textContent = doneStatus;
      } catch {
        status.textContent = 'The request failed. Please try again.';
      } finally {
        button.disabled = false;
        box.removeAttribute('aria-busy');
      }
    }

    retrieveButton.addEventListener('click', retrieveConsultation);

    analyseButton.addEventListener('click', () => {
      const text = box1.textContent;

      if (!text.trim()) {
        status.textContent = 'Load text into box 1 first.';
        return;
      }

      askVenice(
        '/api/analyse',
        text,
        box2,
        analyseButton,
        'Asking for the analysis.',
        'Box 2 now shows only the analysis.'
      );
    });

    document.getElementById('copy-box2').addEventListener('click', () => {
      box3.textContent = box2.textContent;
      status.textContent = box2.textContent.trim()
        ? 'Text copied from box 2 into box 3.'
        : 'Box 2 is empty. Box 3 has been cleared.';
    });

    prescriptionButton.addEventListener('click', () => {
      const text = box2.textContent;

      if (!text.trim()) {
        status.textContent = 'Run LLM analysis first so box 2 has an answer.';
        return;
      }

      askVenice(
        '/api/prescription',
        text,
        box3,
        prescriptionButton,
        'Asking for the prescription.',
        'Box 3 now shows only the prescription.'
      );
    });

    retrieveConsultation();
  </script>
</body>
</html>
